[package]
name = "powershift"
version = "0.1.0"
description = "PowerShift - Intelligent Household Energy Optimization System"
authors = ["Praveen Kumar"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "powershift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
getrandom = "0.3"

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
win32job = "2"
